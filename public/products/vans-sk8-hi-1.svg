<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img">
  <defs>
    <!-- Fondo casi plano: el borde de la imagen tiene que fundirse con la
         página y con el pozo de la tarjeta, sin dibujar ningún círculo. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#17161a"/>
      <stop offset="0.6" stop-color="#121114"/>
      <stop offset="1" stop-color="#0f0f10"/>
    </linearGradient>
    <linearGradient id="upperGrad" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3a3a35"/>
      <stop offset="0.5" stop-color="#20201b"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="midGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e5e4dc"/>
    </linearGradient>
    <linearGradient id="soleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dddcd4"/>
      <stop offset="1" stop-color="#bdbcb4"/>
    </linearGradient>
    <linearGradient id="collarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0e09"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="lace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfaf2"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="contact" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="93"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>
  <!-- Sombra de contacto: pegada a la suela y achatada, para que se lea
       como apoyo en el piso y no como un halo redondo. -->
  <ellipse cx="508" cy="598" rx="215" ry="13" fill="#000" opacity="0.5" filter="url(#contact)"/>

  <g transform="">
    <g transform="">
      <g transform="rotate(0 500 500)">
        
  <g transform="translate(150 250)">
    <!-- suela: cuña completa, después el piso de goma encima -->
    <path d="M104 258 C94 230, 108 214, 138 212 L470 242 C545 256, 596 280, 614 302 C618 322, 600 336, 570 338 L150 338 C116 336, 98 300, 104 258 Z" fill="url(#midGrad)"/>
    <ellipse cx="164" cy="282" rx="40" ry="14" fill="#f2f0e4" opacity="0.35"/>
    <ellipse cx="164" cy="282" rx="40" ry="14" fill="none" stroke="#f2f0e4" stroke-opacity="0.6" stroke-width="1.5"/>
    <path d="M100 306 C104 326, 122 337, 152 338 L570 338 C600 336, 618 322, 614 302 C440 316, 240 316, 100 306 Z" fill="url(#soleGrad)"/>
    <path d="M104 300 C250 314, 460 314, 614 302" fill="none" stroke="#000" stroke-opacity="0.3" stroke-width="1.8"/>

    <!-- corte -->
    <path d="M108 258 C96 206, 94 132, 116 100 C136 72, 180 74, 194 104 C206 130, 200 172, 204 202 C222 214, 252 208, 282 202 C330 194, 388 200, 448 216 C512 234, 572 264, 610 296 C500 288, 280 268, 108 258 Z" fill="url(#upperGrad)"/>
    <path d="M288 206 C340 198, 396 204, 452 218 C450 230, 444 240, 438 246 C384 232, 330 226, 292 226 Z" fill="#0a0a05" opacity="0.85"/>
    <path d="M176 274 C228 266, 290 250, 352 230 C384 220, 404 224, 400 236 C396 250, 360 262, 312 272 C258 284, 208 288, 178 288 Z" fill="#f2f0e4" opacity="0.92"/>
    <path d="M176 274 C228 266, 290 250, 352 230 C384 220, 404 224, 400 236 C396 250, 360 262, 312 272 C258 284, 208 288, 178 288 Z" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="1.5"/>
    <path d="M496 238 C526 256, 554 276, 572 290" fill="none" stroke="#000" stroke-opacity="0.3" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M156 168 C144 196, 140 226, 144 258" fill="none" stroke="#000" stroke-opacity="0.26" stroke-width="2.5" stroke-linecap="round"/>

    <!-- lengüeta y boca del cuello -->
    <path d="M214 200 C216 164, 228 126, 244 118 C256 112, 260 140, 256 170 C253 188, 240 202, 226 208 Z" fill="url(#collarGrad)"/>
    <path d="M124 104 C146 88, 180 92, 192 112 C200 128, 180 134, 158 128 C138 122, 124 118, 124 104 Z" fill="#000" fill-opacity="0.5"/>
    <path d="M296 214 C308 222, 316 226, 326 229"
         stroke="url(#lace)" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <circle cx="328" cy="230" r="3" fill="#24231f" opacity="0.55"/>
    <path d="M328 219 C340 227, 348 231, 358 234"
         stroke="url(#lace)" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <circle cx="360" cy="235" r="3" fill="#24231f" opacity="0.55"/>
    <path d="M360 224 C372 232, 380 236, 390 239"
         stroke="url(#lace)" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <circle cx="392" cy="240" r="3" fill="#24231f" opacity="0.55"/>
    <path d="M392 229 C404 237, 412 241, 422 244"
         stroke="url(#lace)" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <circle cx="424" cy="245" r="3" fill="#24231f" opacity="0.55"/>
    <path d="M424 234 C436 242, 444 246, 454 249"
         stroke="url(#lace)" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <circle cx="456" cy="250" r="3" fill="#24231f" opacity="0.55"/>

    <!-- tirador del talón -->
    <rect x="122" y="88" width="24" height="8" rx="4"
          fill="#f2f0e4" opacity="0.7"/>

    <!-- brillo del corte -->
    <path d="M108 258 C96 206, 94 132, 116 100 C136 72, 180 74, 194 104 C206 130, 200 172, 204 202 C222 214, 252 208, 282 202 C330 194, 388 200, 448 216 C512 234, 572 264, 610 296 C500 288, 280 268, 108 258 Z" fill="url(#sheen)" opacity="0.5"/>
    <path d="M108 258 C96 206, 94 132, 116 100 C136 72, 180 74, 194 104 C206 130, 200 172, 204 202 C222 214, 252 208, 282 202 C330 194, 388 200, 448 216 C512 234, 572 264, 610 296 C500 288, 280 268, 108 258 Z" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="1.5"/>
  </g>
      </g>
    </g>
  </g>

  <rect width="1000" height="1000" filter="url(#grain)" opacity="0.045" style="mix-blend-mode:overlay"/>
</svg>