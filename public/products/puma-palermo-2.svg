<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img">
  <defs>
    <!-- Fondo oscuro con foco cálido: estas imágenes viven dentro del panel
         de foco de la tarjeta, así que tienen que continuar ese charco de
         luz, no contrastar con él. -->
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.72">
      <stop offset="0" stop-color="#2a2825"/>
      <stop offset="0.62" stop-color="#151416"/>
      <stop offset="1" stop-color="#0f0f10"/>
    </radialGradient>
    <radialGradient id="bloom">
      <stop offset="0" stop-color="#c9a063" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#c9a063" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#c9a063" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="upperGrad" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#a6a79e"/>
      <stop offset="0.5" stop-color="#8c8d84"/>
      <stop offset="1" stop-color="#6a6b62"/>
    </linearGradient>
    <linearGradient id="midGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffff2"/>
      <stop offset="1" stop-color="#ddd9ca"/>
    </linearGradient>
    <linearGradient id="soleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d5d1c2"/>
      <stop offset="1" stop-color="#b5b1a2"/>
    </linearGradient>
    <linearGradient id="collarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a7b72"/>
      <stop offset="1" stop-color="#585950"/>
    </linearGradient>
    <linearGradient id="lace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffffe"/>
      <stop offset="1" stop-color="#f3efe0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="38"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="660" cy="380" r="330" fill="url(#bloom)"/>
  <!-- Sombra de contacto sobre el foco -->
  <ellipse cx="508" cy="600" rx="262" ry="26" fill="#000" opacity="0.6" filter="url(#soft)"/>
  <ellipse cx="508" cy="594" rx="160" ry="16" fill="#c9a063" opacity="0.14" filter="url(#soft)"/>

  <g transform="">
    <g transform="scale(-1 1) translate(-1000 0)">
      <g transform="rotate(-4 500 500)">
        
  <g transform="translate(150 250)">
    <!-- suela: cuña completa, después el piso de goma encima -->
    <path d="M104 258 C94 230, 108 214, 138 212 L470 242 C545 256, 596 280, 614 302 C618 322, 600 336, 570 338 L150 338 C116 336, 98 300, 104 258 Z" fill="url(#midGrad)"/>
    <ellipse cx="164" cy="282" rx="40" ry="14" fill="#efe9d2" opacity="0.35"/>
    <ellipse cx="164" cy="282" rx="40" ry="14" fill="none" stroke="#efe9d2" stroke-opacity="0.6" stroke-width="1.5"/>
    <path d="M100 306 C104 326, 122 337, 152 338 L570 338 C600 336, 618 322, 614 302 C440 316, 240 316, 100 306 Z" fill="url(#soleGrad)"/>
    <path d="M104 300 C250 314, 460 314, 614 302" fill="none" stroke="#000" stroke-opacity="0.3" stroke-width="1.8"/>

    <!-- corte -->
    <path d="M108 258 C100 218, 106 176, 128 156 C146 141, 176 145, 186 166 C194 182, 196 194, 204 202 C222 214, 252 208, 282 202 C330 194, 388 200, 448 216 C512 234, 572 264, 610 296 C500 288, 280 268, 108 258 Z" fill="url(#upperGrad)"/>
    <path d="M288 206 C340 198, 396 204, 452 218 C450 230, 444 240, 438 246 C384 232, 330 226, 292 226 Z" fill="#76776e" opacity="0.85"/>
    <path d="M176 274 C228 266, 290 250, 352 230 C384 220, 404 224, 400 236 C396 250, 360 262, 312 272 C258 284, 208 288, 178 288 Z" fill="#efe9d2" opacity="0.92"/>
    <path d="M176 274 C228 266, 290 250, 352 230 C384 220, 404 224, 400 236 C396 250, 360 262, 312 272 C258 284, 208 288, 178 288 Z" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="1.5"/>
    <path d="M496 238 C526 256, 554 276, 572 290" fill="none" stroke="#000" stroke-opacity="0.3" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M156 168 C144 196, 140 226, 144 258" fill="none" stroke="#000" stroke-opacity="0.26" stroke-width="2.5" stroke-linecap="round"/>

    <!-- lengüeta y boca del cuello -->
    <path d="M258 206 C264 192, 286 184, 310 188 C324 191, 322 200, 308 208 C294 215, 270 214, 258 206 Z" fill="url(#collarGrad)"/>
    <path d="M184 168 C202 190, 224 204, 254 208 C276 212, 262 226, 232 220 C202 213, 182 194, 184 168 Z" fill="#000" fill-opacity="0.5"/>
    <path d="M296 214 C308 222, 316 226, 326 229"
         stroke="url(#lace)" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <circle cx="328" cy="230" r="3" fill="#24231f" opacity="0.55"/>
    <path d="M328 219 C340 227, 348 231, 358 234"
         stroke="url(#lace)" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <circle cx="360" cy="235" r="3" fill="#24231f" opacity="0.55"/>
    <path d="M360 224 C372 232, 380 236, 390 239"
         stroke="url(#lace)" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <circle cx="392" cy="240" r="3" fill="#24231f" opacity="0.55"/>
    <path d="M392 229 C404 237, 412 241, 422 244"
         stroke="url(#lace)" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <circle cx="424" cy="245" r="3" fill="#24231f" opacity="0.55"/>
    <path d="M424 234 C436 242, 444 246, 454 249"
         stroke="url(#lace)" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <circle cx="456" cy="250" r="3" fill="#24231f" opacity="0.55"/>

    <!-- tirador del talón -->
    <rect x="132" y="148" width="24" height="8" rx="4"
          fill="#efe9d2" opacity="0.7"/>

    <!-- brillo del corte -->
    <path d="M108 258 C100 218, 106 176, 128 156 C146 141, 176 145, 186 166 C194 182, 196 194, 204 202 C222 214, 252 208, 282 202 C330 194, 388 200, 448 216 C512 234, 572 264, 610 296 C500 288, 280 268, 108 258 Z" fill="url(#sheen)" opacity="0.5"/>
    <path d="M108 258 C100 218, 106 176, 128 156 C146 141, 176 145, 186 166 C194 182, 196 194, 204 202 C222 214, 252 208, 282 202 C330 194, 388 200, 448 216 C512 234, 572 264, 610 296 C500 288, 280 268, 108 258 Z" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="1.5"/>
  </g>
      </g>
    </g>
  </g>

  <rect width="1000" height="1000" filter="url(#grain)" opacity="0.045" style="mix-blend-mode:overlay"/>
</svg>